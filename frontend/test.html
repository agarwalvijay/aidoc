<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Doctor — Test Suite</title>
  <style>
    :root {
      --bg: #060b18;
      --panel: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.12);
      --accent: #65d1c4;
      --text: #ecf5ff;
      --muted: #7aaacc;
      --pass: #4caf7d;
      --fail: #e05555;
      --warn: #e09a30;
      --pending: #5a7a99;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(145deg, #060b18, #0e1f3b);
      color: var(--text);
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      padding: 28px 20px;
    }
    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 22px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(130deg, var(--accent), #8ad0ff); color: #06141e; }
    .btn-secondary { background: rgba(40,70,115,0.8); color: #dcecff; }
    .btn:hover:not(:disabled) { opacity: 0.85; }

    #summary {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .summary-pill {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.82rem;
    }
    .summary-pill span { font-weight: 700; }
    .s-pass { color: var(--pass); }
    .s-fail { color: var(--fail); }
    .s-pending { color: var(--muted); }

    .test-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .test-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
    }
    .test-header:hover { background: rgba(255,255,255,0.03); }
    .status-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--pending);
      transition: background 0.3s;
    }
    .status-dot.running  { background: var(--accent); animation: pulse 1s infinite; }
    .status-dot.pass     { background: var(--pass); animation: none; }
    .status-dot.fail     { background: var(--fail); animation: none; }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: 0.4; }
    }
    .test-name { font-weight: 700; font-size: 1rem; flex: 1; }
    .test-desc { color: var(--muted); font-size: 0.8rem; flex: 2; }
    .badge {
      border-radius: 999px;
      padding: 3px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-pass    { background: rgba(76,175,125,0.2); color: var(--pass); border: 1px solid rgba(76,175,125,0.4); }
    .badge-fail    { background: rgba(224,85,85,0.2);  color: var(--fail); border: 1px solid rgba(224,85,85,0.4); }
    .badge-pending { background: rgba(90,122,153,0.2); color: var(--muted); border: 1px solid rgba(90,122,153,0.3); }
    .badge-running { background: rgba(101,209,196,0.15); color: var(--accent); border: 1px solid rgba(101,209,196,0.3); }
    .badge-warn    { background: rgba(224,154,48,0.2); color: var(--warn); border: 1px solid rgba(224,154,48,0.4); }

    .test-body { display: none; padding: 0 20px 20px; }
    .test-body.open { display: block; }

    .test-meta {
      display: flex;
      gap: 20px;
      margin-bottom: 14px;
      font-size: 0.8rem;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .test-meta strong { color: var(--text); }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 14px 0 8px;
    }

    .convo-log {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.83rem;
      line-height: 1.6;
      max-height: 220px;
      overflow-y: auto;
    }
    .convo-line { margin-bottom: 6px; }
    .convo-line.ai  { color: #9edfff; }
    .convo-line.you { color: #d4f5e9; }
    .convo-lbl { font-weight: 700; font-size: 0.72rem; margin-right: 4px; }
    .ai  .convo-lbl { color: var(--accent); }
    .you .convo-lbl { color: #65e8b4; }

    .assessment-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    @media (max-width: 600px) { .assessment-grid { grid-template-columns: 1fr; } }
    .assessment-item {
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.8rem;
    }
    .assessment-item .ai-label { color: var(--muted); font-size: 0.7rem; margin-bottom: 4px; }
    .assessment-item .ai-value { color: var(--text); }

    .urgency-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(0,0,0,0.2);
      font-size: 0.85rem;
    }
    .urgency-chip {
      border-radius: 8px;
      padding: 5px 14px;
      font-weight: 700;
      font-size: 0.82rem;
    }
    .u-emergency { background: #8b0000; color: #ffdddd; }
    .u-urgent    { background: #7a3800; color: #ffe5c0; }
    .u-soon      { background: #5a4a00; color: #fff4b0; }
    .u-monitor   { background: #0a3d22; color: #b8f5d0; }
    .u-unknown   { background: #2a2a2a; color: #aaa; }

    .run-btn {
      border: 0;
      border-radius: 8px;
      padding: 7px 16px;
      background: rgba(40,70,115,0.8);
      color: #dcecff;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      margin-left: auto;
    }
    .run-btn:hover { background: rgba(60,100,160,0.9); }
    .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .error-box {
      background: rgba(200,50,50,0.1);
      border: 1px solid rgba(200,50,50,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: #ffaaaa;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>AI Doctor — Test Suite</h1>
  <p class="subtitle">Automated regression tests against the live API. Each case sends scripted responses and validates the urgency output.</p>

  <div class="toolbar">
    <button id="runAllBtn" class="btn btn-primary">▶ Run All Tests</button>
    <button id="resetBtn" class="btn btn-secondary">Reset</button>
  </div>

  <div id="summary">
    <div class="summary-pill">Total: <span id="sTotal">0</span></div>
    <div class="summary-pill s-pass">Pass: <span id="sPass">0</span></div>
    <div class="summary-pill s-fail">Fail: <span id="sFail">0</span></div>
    <div class="summary-pill s-warn">Warn: <span id="sWarn">0</span></div>
    <div class="summary-pill s-pending">Pending: <span id="sPending">0</span></div>
  </div>

  <div id="testList"></div>

  <script>
    const API = window.location.hostname === "localhost" ? "http://localhost:8000" : "";

    // ─────────────────────────────────────────────────────────────────
    // Test case definitions
    // ─────────────────────────────────────────────────────────────────
    const TEST_CASES = [
      {
        id: "uti_uncomplicated",
        name: "Uncomplicated UTI",
        description: "35yo female, burning urination 3 days, severity 4/10, no fever or flank pain",
        expected: ["specialist_soon"],
        profile: {
          age: 35, sex: "female", specialty: "primary_care",
          chief_complaint: "burning sensation when urinating",
          pmh_conditions: [], current_medications: [], allergies: [],
        },
        responses: [
          "I have a burning sensation when I urinate and I need to go more frequently than usual",
          "About 3 days now",
          "About a 4 out of 10",
          "No fever, no back or flank pain, no discharge, no nausea",
          "No other symptoms",
        ],
      },
      {
        id: "cardiac_red_flag",
        name: "Cardiac Emergency — Red Flag Gate",
        description: "55yo male, chest pain radiating to left arm — should hit deterministic gate",
        expected: ["emergency_now"],
        profile: {
          age: 55, sex: "male", specialty: "primary_care",
          chief_complaint: "chest pain",
          pmh_conditions: ["Hypertension", "Heart Disease"],
          current_medications: ["Lisinopril 10mg"], allergies: [],
        },
        responses: [
          "I have crushing chest pain radiating to my left arm and I am sweating",
        ],
      },
      {
        id: "mild_uri",
        name: "Mild URI / Common Cold",
        description: "28yo, sore throat + runny nose 2 days, severity 3/10, no fever",
        expected: ["self_care_monitor", "specialist_soon"],
        profile: {
          age: 28, sex: "male", specialty: "primary_care",
          chief_complaint: "sore throat and runny nose",
          pmh_conditions: [], current_medications: [], allergies: [],
        },
        responses: [
          "I have a sore throat, runny nose, and mild congestion. It started gradually.",
          "About 2 days ago. No fever — I checked, it was 98.6.",
          "About a 3 out of 10, pretty mild. I'm still going to work.",
          "No ear pain, no difficulty swallowing, no chest pain or shortness of breath.",
          "Just a bit run down and tired. No body aches beyond that.",
          "A coworker was sick last week so I think I caught something. No known allergies.",
          "No, nothing else. That's everything.",
        ],
      },
    ];

    // ─────────────────────────────────────────────────────────────────
    // State
    // ─────────────────────────────────────────────────────────────────
    const state = {};   // id → { status, result, log, error }
    let running = false;

    TEST_CASES.forEach(tc => {
      state[tc.id] = { status: "pending", result: null, log: [], error: null };
    });

    // ─────────────────────────────────────────────────────────────────
    // Urgency helpers
    // ─────────────────────────────────────────────────────────────────
    const URGENCY_LABELS = {
      emergency_now:     "EMERGENCY NOW",
      urgent_today:      "URGENT TODAY",
      specialist_soon:   "SPECIALIST SOON",
      self_care_monitor: "SELF CARE",
    };
    const URGENCY_CLS = {
      emergency_now: "u-emergency", urgent_today: "u-urgent",
      specialist_soon: "u-soon", self_care_monitor: "u-monitor",
    };

    function urgencyChip(u) {
      const label = URGENCY_LABELS[u] || u || "unknown";
      const cls   = URGENCY_CLS[u] || "u-unknown";
      return `<span class="urgency-chip ${cls}">${label}</span>`;
    }

    // ─────────────────────────────────────────────────────────────────
    // SSE reader (reused from main app)
    // ─────────────────────────────────────────────────────────────────
    async function readTurnStream(response) {
      const reader  = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let resultData = null;
      let streamError = null;

      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop();
          for (const part of parts) {
            const line = part.trim();
            if (!line.startsWith("data: ")) continue;
            try {
              const evt = JSON.parse(line.slice(6));
              if (evt.type === "result") resultData = evt.data;
              if (evt.type === "error") streamError = evt.message;
            } catch (_) {}
          }
        }
      } catch (readErr) {
        streamError = readErr.message;
      }
      if (streamError && !resultData) throw new Error(`Server error: ${streamError}`);
      return resultData;
    }

    // ─────────────────────────────────────────────────────────────────
    // Run a single test case
    // ─────────────────────────────────────────────────────────────────
    async function runTest(tc) {
      const s = state[tc.id];
      s.status = "running";
      s.log = [];
      s.result = null;
      s.error = null;
      render();

      try {
        // Start session
        const startRes = await fetch(`${API}/api/session/start`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ patient_profile: tc.profile }),
        });
        if (!startRes.ok) throw new Error(`Session start failed: HTTP ${startRes.status}`);
        const start = await startRes.json();
        const sessionId = start.session_id;

        s.log.push({ role: "ai", text: `${start.welcome_message} ${start.first_question}` });
        render();

        // Send scripted responses one at a time
        let finalResult = null;
        for (let i = 0; i < tc.responses.length; i++) {
          const transcript = tc.responses[i];
          s.log.push({ role: "you", text: transcript });
          render();

          const turnRes = await fetch(`${API}/api/session/${sessionId}/turn`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ transcript }),
          });
          if (!turnRes.ok) throw new Error(`Turn failed: HTTP ${turnRes.status}`);

          const data = await readTurnStream(turnRes);
          if (!data) throw new Error("No result from turn stream");

          s.log.push({ role: "ai", text: data.assistant_message });
          render();

          if (!data.ask_follow_up) {
            finalResult = data;
            break;
          }
        }

        // If scripted responses ran out, send up to 4 "no more" fallbacks to give
        // the conversational AI a chance to wrap up naturally
        const fallbacks = [
          "No, nothing else to add.",
          "That's really everything. No other symptoms.",
          "No other symptoms at all.",
          "Nothing more — that covers it.",
        ];
        for (let f = 0; f < fallbacks.length && !finalResult; f++) {
          const fallbackRes = await fetch(`${API}/api/session/${sessionId}/turn`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ transcript: fallbacks[f] }),
          });
          if (!fallbackRes.ok) break;
          const data = await readTurnStream(fallbackRes);
          if (data) {
            s.log.push({ role: "you", text: fallbacks[f] });
            s.log.push({ role: "ai", text: data.assistant_message });
            render();
            if (!data.ask_follow_up) finalResult = data;
          }
        }

        if (!finalResult || !finalResult.assessment) {
          throw new Error("Did not reach assessment within the scripted turns");
        }

        s.result = finalResult.assessment;
        const actualUrgency = finalResult.assessment.urgency;
        const pass = tc.expected.includes(actualUrgency);
        // "warn" = adjacent urgency level (one step off)
        const adjacent = {
          emergency_now: ["urgent_today"],
          urgent_today: ["emergency_now", "specialist_soon"],
          specialist_soon: ["urgent_today", "self_care_monitor"],
          self_care_monitor: ["specialist_soon"],
        };
        const warn = !pass && (adjacent[actualUrgency] || []).some(u => tc.expected.includes(u));
        s.status = pass ? "pass" : warn ? "warn" : "fail";

      } catch (err) {
        s.error = err.message;
        s.status = "fail";
      }

      render();
    }

    // ─────────────────────────────────────────────────────────────────
    // Render
    // ─────────────────────────────────────────────────────────────────
    function render() {
      // Summary counts
      const counts = { pass: 0, fail: 0, warn: 0, pending: 0 };
      TEST_CASES.forEach(tc => {
        const st = state[tc.id].status;
        if (counts[st] !== undefined) counts[st]++;
      });
      document.getElementById("sTotal").textContent   = TEST_CASES.length;
      document.getElementById("sPass").textContent    = counts.pass;
      document.getElementById("sFail").textContent    = counts.fail + counts.warn;
      document.getElementById("sWarn").textContent    = counts.warn;
      document.getElementById("sPending").textContent = counts.pending + (TEST_CASES.length - counts.pass - counts.fail - counts.warn - counts.pending);

      // Test cards
      const list = document.getElementById("testList");
      list.innerHTML = "";

      TEST_CASES.forEach(tc => {
        const s = state[tc.id];
        const isOpen = s.status !== "pending" || s._open;

        const card = document.createElement("div");
        card.className = "test-card";

        // Badge
        let badgeCls = "badge-pending", badgeText = "Pending";
        if (s.status === "running") { badgeCls = "badge-running"; badgeText = "Running..."; }
        if (s.status === "pass")    { badgeCls = "badge-pass";    badgeText = "Pass ✓"; }
        if (s.status === "fail")    { badgeCls = "badge-fail";    badgeText = "Fail ✗"; }
        if (s.status === "warn")    { badgeCls = "badge-warn";    badgeText = "Warn ~"; }

        const expectedLabels = tc.expected.map(u => URGENCY_LABELS[u] || u).join(" or ");

        card.innerHTML = `
          <div class="test-header" data-id="${tc.id}">
            <div class="status-dot ${s.status}"></div>
            <div class="test-name">${tc.name}</div>
            <div class="test-desc">${tc.description}</div>
            <span class="badge ${badgeCls}">${badgeText}</span>
            <button class="run-btn" data-run="${tc.id}" ${running ? "disabled" : ""}>Run</button>
          </div>
          <div class="test-body ${isOpen ? "open" : ""}" id="body-${tc.id}">
            <div class="test-meta">
              <div>Expected: <strong>${expectedLabels}</strong></div>
              ${s.result ? `<div>Got: <strong>${URGENCY_LABELS[s.result.urgency] || s.result.urgency}</strong></div>` : ""}
              ${s.result ? `<div>Confidence: <strong>${s.result.confidence_level || "—"}</strong></div>` : ""}
            </div>

            ${s.result ? `
              <div class="urgency-row">
                Expected: ${tc.expected.map(u => urgencyChip(u)).join(" or ")}
                &nbsp;→&nbsp; Got: ${urgencyChip(s.result.urgency)}
              </div>
            ` : ""}

            ${s.log.length ? `
              <div class="section-label">Conversation</div>
              <div class="convo-log">
                ${s.log.map(l => `
                  <div class="convo-line ${l.role}">
                    <span class="convo-lbl">${l.role === "ai" ? "AI Doctor:" : "You:"}</span>
                    ${escHtml(l.text)}
                  </div>`).join("")}
              </div>
            ` : ""}

            ${s.result ? `
              <div class="section-label">Assessment</div>
              <div class="assessment-grid">
                <div class="assessment-item">
                  <div class="ai-label">Likely Conditions</div>
                  <div class="ai-value">${(s.result.likely_conditions || []).join(", ") || "—"}</div>
                </div>
                <div class="assessment-item">
                  <div class="ai-label">Recommended Next Step</div>
                  <div class="ai-value">${escHtml(s.result.recommended_next_step || "—")}</div>
                </div>
                <div class="assessment-item">
                  <div class="ai-label">Why This Assessment</div>
                  <div class="ai-value">${escHtml(s.result.reasoning_summary || s.result.reasoning || "—")}</div>
                </div>
                ${(s.result.prescription_guidance || []).length ? `
                <div class="assessment-item">
                  <div class="ai-label">Medication Guidance</div>
                  <div class="ai-value">${(s.result.prescription_guidance).map(r => escHtml(r)).join("<br>")}</div>
                </div>` : ""}
              </div>
            ` : ""}

            ${s.error ? `<div class="error-box">Error: ${escHtml(s.error)}</div>` : ""}
          </div>
        `;

        list.appendChild(card);
      });

      // Toggle body open/close
      document.querySelectorAll(".test-header").forEach(h => {
        h.addEventListener("click", (e) => {
          if (e.target.classList.contains("run-btn")) return;
          const id = h.dataset.id;
          state[id]._open = !state[id]._open;
          render();
        });
      });

      // Individual run buttons
      document.querySelectorAll(".run-btn").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          e.stopPropagation();
          if (running) return;
          const id = btn.dataset.run;
          const tc = TEST_CASES.find(t => t.id === id);
          running = true;
          updateToolbar();
          await runTest(tc);
          running = false;
          updateToolbar();
        });
      });
    }

    function updateToolbar() {
      document.getElementById("runAllBtn").disabled = running;
      document.getElementById("resetBtn").disabled  = running;
    }

    function escHtml(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    // ─────────────────────────────────────────────────────────────────
    // Controls
    // ─────────────────────────────────────────────────────────────────
    document.getElementById("runAllBtn").addEventListener("click", async () => {
      if (running) return;
      running = true;
      updateToolbar();
      for (const tc of TEST_CASES) {
        await runTest(tc);
      }
      running = false;
      updateToolbar();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (running) return;
      TEST_CASES.forEach(tc => {
        state[tc.id] = { status: "pending", result: null, log: [], error: null };
      });
      render();
    });

    // Initial render
    render();
  </script>
</body>
</html>
